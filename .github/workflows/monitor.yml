name: Check Hyrox Pages (Selenium)

on:
  workflow_dispatch:
    inputs:
      priority:
        description: 'Priority level to run (high, medium, low, all)'
        required: true
        default: 'high'
        type: choice
        options:
          - high
          - medium
          - low
          - all
  schedule:
    # Scripts triggered using cron-job.org
    # Backup: Runs everything once a day at 20:07 UTC
    - cron: '07 20 * * *'   

jobs:
  check_for_updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changes_detected: ${{ steps.run_script.outputs.changes_detected }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Install Python dependencies
        run: pip install selenium Pillow pytz
      
      - name: Run Python Selenium script
        id: run_script
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          # Use the priority from inputs if triggered via API/Manual, 
          # otherwise default to "all" for the daily backup cron.
          PRIORITY="${{ github.event.inputs.priority || 'all' }}"
          
          if [ "$PRIORITY" == "all" ]; then
            python -u check_hyrox_pages.py
          else
            python -u check_hyrox_pages.py --priority $PRIORITY
          fi

      - name: Commit and push status files
        if: steps.run_script.outputs.changes_detected == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.json
          git commit -m "Update page status [Priority: ${{ github.event.inputs.priority || 'all' }}]"
          git push