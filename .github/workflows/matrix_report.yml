name: Generate Daily Availability Matrix Report

on:
  #schedule:
    # Runs once a day, late in the evening (e.g., 21:00 UTC)
    #- cron: '0 13 * * *'
  workflow_dispatch: # Allows manual runs

jobs:
  build_and_send_matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install selenium Pillow pytz

      - name: Generate Matrix Image (with change detection)
        id: generate_matrix
        run: python -u check_hyrox_pages.py --matrix
      
      - name: Email the Matrix Image
        if: steps.generate_matrix.outputs.matrix_changed == 'true'
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: python -u check_hyrox_pages.py --email-matrix

      - name: Commit and push matrix state files
        run: |
          # Check if any of the 3 matrix-related files have changed
          if [[ `git status --porcelain matrix_last_state.json matrix_intermediate_changes.json availability_matrix.png` ]]; then
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            
            # Add the state file, the intermediate log (to clear it), and the image
            git add matrix_last_state.json matrix_intermediate_changes.json availability_matrix.png
            
            git commit -m "Update daily matrix state and clear intermediate logs"
            git push
          else
            echo "No changes to matrix state. Nothing to commit."
          fi
